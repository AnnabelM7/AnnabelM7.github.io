<section class="py-5">
    <div class="container">
        <div class="row">
            <div class="col-lg-6 d-flex align-items-start flex-column">
                <div class="mb-auto p-2">
                    <h4>Teie ostukorv</h4>
                </div>
                <div class="mb-auto p-2 row">
                    <div class="col-lg-6">
                        <img src="stephan-seeber-NzAfGi8XuA4-unsplash.jpg" width="100%">
                    </div>
                    <!-- Korrastasin veidi ka seda osa -->
                    <div class="col-lg-3">
                        <h6 class="mb-1">Ilusad saapad</h6>
                        <p class="mb-3 fs-5 fw-semibold">199 &euro;</p>

                        <label for="kogus" class="form-label">Kogus</label>
                        <select class="form-select" id="kogus">
                            <option value="0">0</option>
                            <option value="1" selected>1</option>
                            <option value="2">2</option>
                            <option value="3">3</option>
                        </select>
                    </div>
                </div>
                <!--
             <div class="p-2">
               <p>Tarne: tasuta</span></p>
               <p>Kokku: 199 &#8364;</span></p>
             </div>
             <div class="p-2 mx-auto">
               <a href="#" class="btn btn-primary btn-lg mb-3">Maksma</a>
             </div>
             -->
            </div>
            <div class="col-lg-6">
                <!--Tee ise: korrasta (lisa) ostukorvi vormi nii, et sellel oleks väljad kasutaja andmete jaoks, makse ja tarneviisi valik ning ostukorv oleks kujundatud järgides kasutajaliidese disaini põhimõtteid.-->
                <div class="card p-4">
                    <form>
                        <h5 class="mb-3">Kasutaja andmed</h5>
                        <div class="mb-3">
                            <label for="nimi" class="form-label">Nimi</label>
                            <input type="text" class="form-control" id="nimi" required>
                        </div>
                        <div class="mb-3">
                            <label for="epost" class="form-label">E-post</label>
                            <input type="email" class="form-control" id="epost" required>
                        </div>
                        <div class="mb-4">
                            <label for="aadress" class="form-label">Aadress</label>
                            <input type="text" class="form-control" id="aadress" required>
                        </div>

                        <h5 class="mb-3">Tarneviis</h5>
                        <select class="form-select mb-4">
                            <option>Kulleriga koju</option>
                            <option>Pakiautomaati (tasuta)</option>
                        </select>

                        <h5 class="mb-3">Maksmine</h5>
                        <select class="form-select mb-4">
                            <option>Pangakaart</option>
                            <option>Pangalink</option>
                            <option>Google pay</option>
                        </select>

                        <button type="submit" class="btn btn-primary btn-lg w-100">Kinnita oma tellimus</button>
                    </form>
                </div>
            </div>

        </div>
    </div>
    </div>
</section>
